name: Opdater trækninger

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Installer browser
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Hent nye trækninger
        run: python scripts/update_draws.py
      - name: Gem ændringer
        run: |
          if git diff --quiet -- data.json; then
            echo "Ingen ændringer."
          else
            git config user.name "krydsanalyse-bot"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add data.json
            git commit -m "Opdater trækninger"
            git push
          fi
